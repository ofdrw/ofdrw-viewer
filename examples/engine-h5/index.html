<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OFD 渲染示例</title>
    <style>
      body {
        margin: 0;
        font: 14px system-ui, sans-serif;
        background: #eef2f7;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px;
        background: #fff;
      }
      button,
      label {
        padding: 6px 12px;
        border: 1px solid #c7d2e0;
        border-radius: 6px;
        background: #fff;
        font: inherit;
        cursor: pointer;
      }
      button:disabled {
        color: #9aa7b8;
        cursor: not-allowed;
      }
      label input {
        display: none;
      }
      #page {
        min-width: 64px;
        text-align: center;
      }
      main {
        max-width: 900px;
        margin: 16px auto;
        padding: 0 12px;
      }
      #canvas {
        display: block;
        width: 100%;
        height: auto;
        background: #fff;
        box-shadow: 0 4px 16px rgb(0 0 0 / 10%);
      }
    </style>
  </head>
  <body>
    <header>
      <label>
        打开 OFD
        <input id="file" type="file" accept=".ofd,application/ofd" />
      </label>
      <button id="prev" disabled>上一页</button>
      <span id="page">— / —</span>
      <button id="next" disabled>下一页</button>
    </header>

    <main>
      <canvas id="canvas"></canvas>
    </main>

    <script>
      const canvas = document.querySelector('#canvas');
      const ctx = canvas.getContext('2d');
      const pageLabel = document.querySelector('#page');
      const prev = document.querySelector('#prev');
      const next = document.querySelector('#next');
      const fileInput = document.querySelector('#file');

      /** 当前文档；未打开时为 null。 */
      let doc = null;
      /** 当前页索引，从 0 开始。 */
      let index = 0;

      /**
       * 按 index 渲染当前页。
       *
       * @returns {Promise<void>} 渲染完成后 resolve。
       */
      async function render() {
        prev.disabled = true;
        next.disabled = true;

        const page = await doc.getPage(index);
        const viewport = page.getViewport({ dpi: 96 });

        // 画布尺寸由页面决定，引擎只画内容。
        canvas.width = Math.ceil(viewport.width);
        canvas.height = Math.ceil(viewport.height);
        await page.render({ canvasContext: ctx, viewport }).promise;

        pageLabel.textContent = `${index + 1} / ${doc.pageCount}`;
        prev.disabled = index === 0;
        next.disabled = index === doc.pageCount - 1;
      }

      /**
       * 打开 OFD 文件并显示第一页。
       *
       * @param {File} file 浏览器文件对象。
       * @returns {Promise<void>} 打开并渲染完成后 resolve。
       */
      async function open(file) {
        const data = await file.arrayBuffer();
        doc = await OFDRWViewer.OFDDocument.open({ source: { kind: 'arraybuffer', data } });
        index = 0;
        await render();
      }

      fileInput.onchange = () => open(fileInput.files[0]);
      prev.onclick = () => {
        index -= 1;
        render();
      };
      next.onclick = () => {
        index += 1;
        render();
      };
    </script>
