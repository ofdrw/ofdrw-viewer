<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OFD 渲染示例 · engine-h5</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: #1f2937;
        background: #eef2f7;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      header {
        width: 100%;
        padding: 14px 20px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        background: #fff;
        border-bottom: 1px solid #dbe3ee;
      }
      h1 {
        margin: 0 12px 0 0;
        font-size: 16px;
        font-weight: 600;
      }
      button,
      .file-label {
        padding: 7px 14px;
        border: 1px solid #c7d2e0;
        border-radius: 8px;
        background: #fff;
        font: inherit;
        cursor: pointer;
      }
      button:hover:not(:disabled),
      .file-label:hover {
        border-color: #2563eb;
        color: #2563eb;
      }
      button:disabled {
        color: #9aa7b8;
        cursor: not-allowed;
      }
      .file-label input {
        display: none;
      }
      #page-label {
        min-width: 68px;
        text-align: center;
        font-variant-numeric: tabular-nums;
      }
      main {
        width: 100%;
        max-width: 900px;
        padding: 24px 20px 48px;
      }
      #hint {
        min-height: 24px;
        margin: 0 0 12px;
        color: #64748b;
        font-size: 14px;
      }
      #canvas {
        display: block;
        width: 100%;
        height: auto;
        background: #fff;
        border-radius: 4px;
        box-shadow: 0 8px 30px rgb(15 23 42 / 12%);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>OFD 渲染示例</h1>
      <label class="file-label">
        打开 OFD
        <input id="file-input" type="file" accept=".ofd,application/ofd" />
      </label>
      <button id="prev" type="button" disabled>上一页</button>
      <span id="page-label">— / —</span>
      <button id="next" type="button" disabled>下一页</button>
    </header>

    <main>
      <p id="hint">正在加载样例…</p>
      <canvas id="canvas"></canvas>
    </main>

    <!-- 引擎 CDN 产物：IIFE，挂载 globalThis.OFDRWViewer -->
    <script src="./ofdrw-viewer-engine.min.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
