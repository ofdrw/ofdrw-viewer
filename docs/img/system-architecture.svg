    <rect x="432" y="218" width="112" height="26" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="488" y="235.5" text-anchor="middle">Canvas2D 绘制</text>
  </g>

  <rect x="950" y="160" width="266" height="100" rx="12" fill="#ffffff" stroke="#dbe3ee"/>
  <rect x="950" y="160" width="5" height="100" rx="2.5" fill="#0891b2"/>
  <text x="970" y="188" font-size="18" font-weight="700" fill="#0f172a">密码能力</text>
  <rect x="1156" y="168" width="52" height="21" rx="10.5" fill="#e0f2fe"/>
  <text x="1182" y="183" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0369a1">纯 JS</text>
  <text x="970" y="206" font-size="10.5" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" fill="#64748b">ofdrw-viewer-crypto</text>
  <g font-size="12" fill="#334155">
    <rect x="970" y="218" width="60" height="26" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="1000" y="235.5" text-anchor="middle">解密</text>
    <rect x="1038" y="218" width="84" height="26" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="1080" y="235.5" text-anchor="middle">签章验签</text>
    <rect x="1130" y="218" width="60" height="26" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="1160" y="235.5" text-anchor="middle">证书链</text>
  </g>

  <!-- ============ 层3：宿主与资源 ============ -->
  <rect x="216" y="300" width="400" height="100" rx="12" fill="#ffffff" stroke="#dbe3ee"/>
  <circle cx="238" cy="322" r="4" fill="#475569"/>
  <text x="250" y="327" font-size="15" font-weight="700" fill="#0f172a">运行平台</text>
  <g font-size="11.5" fill="#334155">
    <rect x="236" y="340" width="66" height="24" rx="12" fill="#f1f5f9"/>
    <text x="269" y="356" text-anchor="middle">浏览器</text>
    <rect x="310" y="340" width="76" height="24" rx="12" fill="#f1f5f9"/>
    <text x="348" y="356" text-anchor="middle">Node.js</text>
    <rect x="394" y="340" width="66" height="24" rx="12" fill="#f1f5f9"/>
    <text x="427" y="356" text-anchor="middle">小程序</text>
    <rect x="468" y="340" width="66" height="24" rx="12" fill="#f1f5f9"/>
    <text x="501" y="356" text-anchor="middle">服务端</text>
  </g>
  <text x="236" y="388" font-size="10.5" fill="#94a3b8">注入画布、字体、证书与字节源</text>

  <rect x="636" y="300" width="280" height="100" rx="12" fill="#ffffff" stroke="#dbe3ee"/>
  <circle cx="658" cy="322" r="4" fill="#0d9488"/>
  <text x="670" y="327" font-size="15" font-weight="700" fill="#0f172a">输入资源</text>
  <g font-size="11.5" fill="#334155">
    <rect x="656" y="340" width="72" height="24" rx="12" fill="#f1f5f9"/>
    <text x="692" y="356" text-anchor="middle">OFD 字节</text>
    <rect x="736" y="340" width="56" height="24" rx="12" fill="#f1f5f9"/>
    <text x="764" y="356" text-anchor="middle">字体</text>
    <rect x="800" y="340" width="80" height="24" rx="12" fill="#f1f5f9"/>
    <text x="840" y="356" text-anchor="middle">证书 / CRL</text>
  </g>

  <rect x="936" y="300" width="280" height="100" rx="12" fill="#ffffff" stroke="#dbe3ee"/>
  <circle cx="958" cy="322" r="4" fill="#b45309"/>
  <text x="970" y="327" font-size="15" font-weight="700" fill="#0f172a">渲染与导出</text>
  <g font-size="11.5" fill="#334155">
    <rect x="956" y="340" width="108" height="24" rx="12" fill="#f1f5f9"/>
