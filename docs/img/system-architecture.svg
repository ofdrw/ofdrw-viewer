    <rect x="1072" y="340" width="100" height="24" rx="12" fill="#f1f5f9"/>
    <text x="1122" y="356" text-anchor="middle">PNG / WebP</text>
  </g>

  <!-- ============ 核心库内部依赖 ============ -->
  <path d="M 946 206 L 920 206" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
</svg>