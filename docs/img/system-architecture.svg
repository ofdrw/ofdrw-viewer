<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="448" viewBox="0 0 1280 448" role="img" aria-labelledby="arch-title arch-desc" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <title id="arch-title">OFDRW-Viewer 系统体系架构</title>
  <desc id="arch-desc">三层架构。应用与接入：阅读器 ofdrw-viewer-ui、命令行工具 ofdrw-viewer-cli、HTTP 解析服务 ofdrw-viewer-api-server。核心库：渲染引擎 ofdrw-viewer-engine 与密码能力 ofdrw-viewer-crypto，crypto 使用 engine。宿主与资源：浏览器、Node.js、小程序、服务端提供画布、字体、证书与字节源。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1280" height="448" fill="#f4f7fb"/>

  <!-- 层背景 -->
  <g stroke="#e0e7f1">
    <rect x="40" y="24" width="1200" height="108" rx="16" fill="#eaeff7"/>
    <rect x="40" y="148" width="1200" height="124" rx="16" fill="#eaeff7"/>
    <rect x="40" y="288" width="1200" height="124" rx="16" fill="#eaeff7"/>
  </g>

  <!-- 层标签 -->
  <circle cx="72" cy="55" r="12" fill="#2563eb"/>
  <text x="72" y="59" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">01</text>
  <text x="92" y="60" font-size="14" font-weight="700" fill="#0f172a">应用与接入</text>
  <text x="92" y="76" font-size="8.5" letter-spacing="1.1" fill="#64748b">APPLICATIONS</text>

  <circle cx="72" cy="182" r="12" fill="#7c3aed"/>
  <text x="72" y="186" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">02</text>
  <text x="92" y="187" font-size="14" font-weight="700" fill="#0f172a">核心库</text>
  <text x="92" y="203" font-size="8.5" letter-spacing="1.1" fill="#64748b">CORE LIBRARIES</text>

  <circle cx="72" cy="322" r="12" fill="#475569"/>
  <text x="72" y="326" text-anchor="middle" font-size="10.5" font-weight="700" fill="#ffffff">03</text>
  <text x="92" y="327" font-size="14" font-weight="700" fill="#0f172a">宿主与资源</text>
  <text x="92" y="343" font-size="8.5" letter-spacing="1.1" fill="#64748b">HOST &amp; INPUTS</text>

  <!-- ============ 层1：应用与接入 ============ -->
  <rect x="216" y="36" width="330" height="84" rx="12" fill="#ffffff" stroke="#dbe3ee"/>
  <rect x="216" y="36" width="5" height="84" rx="2.5" fill="#7c3aed"/>
  <text x="236" y="62" font-size="17" font-weight="700" fill="#0f172a">HTML5 OFD 阅读器</text>
  <text x="236" y="80" font-size="10.5" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" fill="#64748b">ofdrw-viewer-ui</text>
  <g font-size="11" fill="#334155">
    <rect x="236" y="90" width="64" height="22" rx="11" fill="#f6f1fd"/>
    <text x="268" y="105" text-anchor="middle">滚动缩放</text>
    <rect x="308" y="90" width="94" height="22" rx="11" fill="#f6f1fd"/>
    <text x="355" y="105" text-anchor="middle">缩略图 / 大纲</text>
    <rect x="410" y="90" width="84" height="22" rx="11" fill="#f6f1fd"/>
    <text x="452" y="105" text-anchor="middle">搜索 / 打印</text>
  </g>

  <rect x="566" y="36" width="330" height="84" rx="12" fill="#ffffff" stroke="#dbe3ee"/>
  <rect x="566" y="36" width="5" height="84" rx="2.5" fill="#f59e0b"/>
  <text x="586" y="62" font-size="17" font-weight="700" fill="#0f172a">命令行工具</text>
  <text x="586" y="80" font-size="10.5" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" fill="#64748b">ofdrw-viewer-cli</text>
  <g font-size="11" fill="#334155">
    <rect x="586" y="90" width="64" height="22" rx="11" fill="#fdf5e9"/>
    <text x="618" y="105" text-anchor="middle">批量转图</text>
    <rect x="658" y="90" width="64" height="22" rx="11" fill="#fdf5e9"/>
    <text x="690" y="105" text-anchor="middle">文字坐标</text>
    <rect x="730" y="90" width="80" height="22" rx="11" fill="#fdf5e9"/>
    <text x="770" y="105" text-anchor="middle">查询 / 验签</text>
  </g>

  <rect x="916" y="36" width="300" height="84" rx="12" fill="#ffffff" stroke="#dbe3ee"/>
  <rect x="916" y="36" width="5" height="84" rx="2.5" fill="#0891b2"/>
  <text x="936" y="62" font-size="17" font-weight="700" fill="#0f172a">OFD HTTP 解析服务</text>
  <text x="936" y="80" font-size="10.5" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" fill="#64748b">ofdrw-viewer-api-server</text>
  <g font-size="11" fill="#334155">
    <rect x="936" y="90" width="62" height="22" rx="11" fill="#e6f6fb"/>
    <text x="967" y="105" text-anchor="middle">同步接口</text>
    <rect x="1006" y="90" width="62" height="22" rx="11" fill="#e6f6fb"/>
    <text x="1037" y="105" text-anchor="middle">异步作业</text>
    <rect x="1076" y="90" width="110" height="22" rx="11" fill="#e6f6fb"/>
    <text x="1131" y="105" text-anchor="middle">附件 / 音视频</text>
  </g>

  <!-- ============ 层2：核心库 ============ -->
  <rect x="216" y="160" width="700" height="100" rx="12" fill="#ffffff" stroke="#dbe3ee"/>
  <rect x="216" y="160" width="5" height="100" rx="2.5" fill="#2563eb"/>
  <text x="236" y="188" font-size="18" font-weight="700" fill="#0f172a">OFD 渲染引擎</text>
  <rect x="814" y="168" width="56" height="21" rx="10.5" fill="#e8efff"/>
  <text x="842" y="183" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1d4ed8">跨平台</text>
  <text x="236" y="206" font-size="10.5" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" fill="#64748b">ofdrw-viewer-engine</text>
  <g font-size="12" fill="#334155">
    <rect x="236" y="218" width="90" height="26" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
