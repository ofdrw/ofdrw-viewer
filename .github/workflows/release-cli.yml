name: 发布 CLI

# 手动触发（可填写发布标签）或推送 cli-v* 标签时构建多平台 SEA 产物。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 发布标签（如 cli-v0.1.0）；留空则只构建、不发布
        required: false
        type: string
  push:
    tags:
      - 'cli-v*'

# 仅创建 Release 需要写权限；不推送代码。
permissions:
  contents: write

env:
  NODE_VERSION: '26.10.0'
  PNPM_VERSION: '11.24.0'

jobs:
  build:
    name: 构建 ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            archive: tar.gz
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            archive: tar.gz
          - runner: macos-13
            platform: darwin
            arch: x64
            archive: tar.gz
          - runner: macos-14
            platform: darwin
            arch: arm64
            archive: tar.gz
          - runner: windows-latest
            platform: windows
            arch: x64
            archive: zip
          - runner: windows-11-arm
            platform: windows
            arch: arm64
            archive: zip
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 engine 与普通 CLI
        run: |
          pnpm --filter @ofdrw/ofdrw-viewer-engine build
          pnpm --filter @ofdrw/ofdrw-viewer-cli build

      - name: 类型检查与测试
        run: |
          pnpm --filter @ofdrw/ofdrw-viewer-cli typecheck
          pnpm --filter @ofdrw/ofdrw-viewer-cli test

      - name: 构建 SEA 可执行文件
        run: pnpm --filter @ofdrw/ofdrw-viewer-cli build:sea

      - name: 冒烟测试（Unix）
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bin=packages/ofdrw-viewer-cli/dist/sea/ofdrw-viewer-cli
          "$bin" --version
          "$bin" --help
          mkdir -p "$RUNNER_TEMP/sea-smoke"
          env -i PATH=/usr/bin:/bin TMPDIR="$RUNNER_TEMP/sea-tmp" \
            "$bin" ofd_pdf_match/helloworld.ofd -o "$RUNNER_TEMP/sea-smoke"
          test -s "$RUNNER_TEMP/sea-smoke/helloworld-p001.png"

      - name: 冒烟测试（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = 'packages/ofdrw-viewer-cli/dist/sea/ofdrw-viewer-cli.exe'
          & $bin --version
          & $bin --help
          $originalPath = $env:PATH
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          try {
            & $bin ofd_pdf_match/helloworld.ofd -o "$env:RUNNER_TEMP\sea-smoke"
          } finally {
            $env:PATH = $originalPath
          }
          if (-not (Test-Path "$env:RUNNER_TEMP\sea-smoke\helloworld-p001.png")) {
            throw 'SEA 转换冒烟未生成 PNG'
          }

      - name: 打包产物（Unix）
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/ofdrw-viewer-cli/package.json').version")
          name="ofdrw-viewer-cli-${version}-${{ matrix.platform }}-${{ matrix.arch }}"
          stage="packages/ofdrw-viewer-cli/dist/sea/release/${name}"
          mkdir -p "$stage"
          cp packages/ofdrw-viewer-cli/dist/sea/ofdrw-viewer-cli "$stage/"
          cp README.md "$stage/"
          if [ -f LICENSE ]; then cp LICENSE "$stage/"; fi
          tar -czf "packages/ofdrw-viewer-cli/dist/sea/release/${name}.tar.gz" -C "$stage" .

      - name: 打包产物（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node -p "require('./packages/ofdrw-viewer-cli/package.json').version"
          $name = "ofdrw-viewer-cli-$version-windows-${{ matrix.arch }}"
          $stage = "packages/ofdrw-viewer-cli/dist/sea/release/$name"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item 'packages/ofdrw-viewer-cli/dist/sea/ofdrw-viewer-cli.exe' $stage
          Copy-Item 'README.md' $stage
          if (Test-Path 'LICENSE') { Copy-Item 'LICENSE' $stage }
          Compress-Archive -Path "$stage/*" -DestinationPath "packages/ofdrw-viewer-cli/dist/sea/release/$name.zip" -Force

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ofdrw-viewer-cli-${{ matrix.platform }}-${{ matrix.arch }}
          path: packages/ofdrw-viewer-cli/dist/sea/release/*.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: 创建 GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/cli-v') || inputs.tag != ''
    runs-on: ubuntu-24.04
    steps:
      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: 生成 SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob
          files=(*.tar.gz *.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo '没有找到发布产物' >&2
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          files: |
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/SHA256SUMS
          fail_on_unmatched_files: true