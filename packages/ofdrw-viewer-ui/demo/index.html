<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ofdrw-viewer-ui demo</title>
    <link rel="stylesheet" href="../dist/style.css" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          'Noto Sans SC',
          sans-serif;
        color: #1f2328;
        background: #f3f4f6;
      }
      #app {
        display: grid;
        grid-template-rows: auto 1fr auto;
        height: 100%;
        min-height: 0;
      }
      .demo-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        padding: 8px 12px;
        background: #fff;
        border-bottom: 1px solid #d8dbe0;
        font-size: 13px;
      }
      .demo-bar label {
        display: inline-flex;
        gap: 4px;
        align-items: center;
      }
      .demo-bar select,
      .demo-bar input[type='file'] {
        font: inherit;
      }
      ofd-viewer {
        min-height: 0;
      }
      .demo-status {
        padding: 6px 12px;
        font-size: 12px;
        color: #5b616b;
        background: #fff;
        border-top: 1px solid #d8dbe0;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="demo-bar">
        <label>
          打开 OFD
          <input id="file" type="file" accept=".ofd,application/ofd" />
        </label>
        <label>
          主题
          <select id="theme">
            <option value="auto">跟随系统</option>
            <option value="light">浅色</option>
            <option value="dark">深色</option>
          </select>
        </label>
        <label>
          语言
          <select id="locale">
            <option value="zh-CN">中文</option>
            <option value="en-US">English</option>
          </select>
        </label>
        <label><input id="feature-print" type="checkbox" checked /> 打印</label>
        <label><input id="feature-find" type="checkbox" checked /> 查找</label>
        <label><input id="feature-toolbar" type="checkbox" checked /> 内置工具栏</label>
      </div>

      <ofd-viewer id="viewer" theme="auto" locale="zh-CN"></ofd-viewer>

      <div id="status" class="demo-status">
        选择本地 .ofd 文件，或在 URL 后追加 <code>?src=/path/to/file.ofd</code>。
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
