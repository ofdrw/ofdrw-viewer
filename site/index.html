<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OFD 阅读器 · 在线演示</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Ctext x='16' y='21' font-family='sans-serif' font-size='11' font-weight='700' fill='white' text-anchor='middle'%3EOF%3C/text%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="ofdrw-viewer-ui 在线演示：在浏览器中直接打开并阅读 OFD 版式文档，支持缩放、旋转、缩略图、大纲、查找、打印与图片导出。"
    />
    <meta property="og:title" content="OFD 阅读器 · 在线演示" />
    <meta
      property="og:description"
      content="在浏览器中直接打开并阅读 OFD 版式文档，无需安装任何软件。"
    />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <ofd-viewer id="viewer" theme="light" locale="zh-CN"></ofd-viewer>

    <!-- 鼠标感应区：靠近视口底部时唤出演示控件，脚本就绪后开启，见 style.css。 -->
    <div class="dock-hover-zone" id="dock-hover-zone"></div>

    <div class="dock" id="dock" role="toolbar" aria-label="演示控件">
      <label class="file-button">
        <input id="file" type="file" accept=".ofd,application/ofd" />
        打开本地 OFD
      </label>
      <label class="field">
        <span>示例</span>
        <select id="sample">
          <option value="">本地文件</option>
          <option value="ofd-viewer-ui-showcase.ofd" selected>功能展示</option>
          <option value="doc1File.ofd">示例文档</option>
          <option value="dense-text-perf.ofd">密集文本</option>
        </select>
      </label>
      <label class="field">
        <span>主题</span>
        <select id="theme">
          <option value="light" selected>浅色</option>
          <option value="auto">跟随系统</option>
          <option value="dark">深色</option>
        </select>
      </label>
      <label class="field">
        <span>语言</span>
        <select id="locale">
          <option value="zh-CN" selected>中文</option>
          <option value="en-US">English</option>
        </select>
      </label>
      <span id="version" class="version"></span>
      <a
        class="repo-link"
        href="https://github.com/ofdrw/ofdrw-viewer"
        target="_blank"
        rel="noreferrer"
        >GitHub</a
      >
    </div>

    <div id="status" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
